<mat-toolbar color="primary" *ngIf="isAuthenticated()">
  <img alt="healthtracker" src="../../assets/images/logo_sin_nombre.png"/>
  <button mat-button routerLink="/">
    <span>Hola</span>
  </button>
  <div>
    <button (click)="logout()" *ngIf="isAuthenticated()" mat-button>
      <span>{{username}}</span>
      <mat-icon>person_outline</mat-icon>
      <span>Logout</span>
    </button>
    <button *ngIf="isAuthenticated()" [matMenuTriggerFor]="profile" mat-button>
      <mat-icon>account_box</mat-icon>
      <span>Profile</span>
    </button>
  </div>
</mat-toolbar>
<mat-menu #profile="matMenu" xPosition="before">
  <button mat-menu-item>
    <mat-icon>settings</mat-icon>
    <span>Settings</span>
  </button>
  <button mat-menu-item routerLink="/home/reviews">
    <mat-icon>grade</mat-icon>
    <span>Reviews</span>
  </button>
  <button mat-menu-item routerLink="/home/online-orders">
    <mat-icon>shopping_basket</mat-icon>
    <span>Online Orders</span>
  </button>
  <button mat-menu-item>
    <mat-icon>money_off</mat-icon>
    <span>Refunds</span>
  </button>
  <button mat-menu-item routerLink="/home/complaints">
    <mat-icon>sentiment_very_dissatisfied</mat-icon>
    <span>Complaints</span>
  </button>
  <button mat-menu-item routerLink="/home/customer-points">
    <mat-icon>score</mat-icon>
    <span>Points</span>
  </button>
  <button mat-menu-item routerLink="/home/technical-support">
    <mat-icon>build</mat-icon>
    <span>Technical Support</span>
  </button>
</mat-menu>
<router-outlet></router-outlet>

<app-footer  *ngIf="isAuthenticated()"></app-footer>
